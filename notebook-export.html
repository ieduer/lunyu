<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <title>帶走這個裝置的收藏 · 論語</title>
  <link rel="stylesheet" href="/assets/css/notebook-export.css">
  <script type="module" src="/assets/js/notebook-export.js"></script>
</head>
<body>
  <main>
    <nav aria-label="返回"><a href="/">← 回到孔子研讀</a></nav>
    <p class="eyebrow">把值得重讀的章句，留在身邊</p>
    <h1>帶走這個裝置的收藏</h1>
    <p class="lead">在收藏原本所在的瀏覽器打開這一頁。先確認內容，再下載一份完整副本。</p>
    <section aria-labelledby="local-title">
      <h2 id="local-title">原裝置的收藏</h2>
      <p id="export-status" role="status" aria-live="polite">尚未讀取。</p>
      <button id="read-bookmarks" type="button">讀取這個瀏覽器的收藏</button>
      <div id="bookmark-preview" hidden>
        <p id="bookmark-count"></p>
        <details><summary>查看原章號與完整儲存原文</summary><textarea id="bookmark-raw" aria-label="原收藏完整儲存文字" readonly></textarea></details>
        <label class="confirm"><input id="confirm-personal" type="checkbox">這是我在這個裝置保存的收藏，我要下載個人副本。</label>
        <button id="download-bookmarks" type="button" disabled>下載收藏副本</button>
      </div>
    </section>
    <section aria-labelledby="next-title">
      <h2 id="next-title">接下來怎麼做</h2>
      <ol><li>保留下載的 JSON 檔案。</li><li>登入合併站後，打開「典藏 → 我的收藏與筆記」。</li><li>選取這份檔案，確認內容及目前帳號，再保存原件。</li></ol>
      <p>舊收藏沒有帳號綁定，轉入後仍會標明原裝置副本與未核定的歷史歸屬，不計入正式分數。原收藏不會被刪除或改寫。</p>
      <p>這一頁不會上傳收藏，也不會讀取對談、作答或其他網站的資料。下載檔案包含個人資料，請自行保留，勿公開分享。</p>
    </section>
  </main>
</body>
</html>
